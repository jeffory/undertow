<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNDERTOW</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #050607;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #buildinfo {
        position: fixed;
        top: 8px;
        right: 10px;
        color: rgba(160, 170, 175, 0.45);
        font: 11px/1.2 monospace;
        z-index: 20;
        pointer-events: none;
        text-align: right;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #7fbf8a;
        font: 12px/1.4 monospace;
        z-index: 20;
        display: none;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug"></div>
    <div id="buildinfo"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
