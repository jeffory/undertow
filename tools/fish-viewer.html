<!doctype html>
<!-- Bestiary-style species showcase (M4 round 2, task t18). Renders ALL 12
     Shallows species from their REAL generated params (gen/fishParams +
     data/species + render/fishMesh) on neutral pedestals in a 4x3 grid, fish
     UPRIGHT (dorsal up) in a natural slight-curve pose, front-3/4 lit like the
     review rig (cool key + warm fill), name + rarity labels. This page IS the
     bestiary reference sheet (tools/fish-sheet.png). Static pose so the sheet
     is deterministic. Served by vite: /tools/fish-viewer.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #243037; overflow: hidden; }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from '/node_modules/three/build/three.module.js';
      import { Rng } from '/src/core/rng';
      import { generateFishParams } from '/src/gen/fishParams';
      import { SHALLOWS_SPECIES } from '/src/data/species';
      import { buildFishRig, readabilityScale } from '/src/render/fishMesh';

      const SCENE = new THREE.Scene();
      SCENE.background = new THREE.Color(0x243037);

      const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);
      const SINGLE = new URLSearchParams(location.search).get('single');
      if (SINGLE) {
        cam.position.set(2.6, 2.2, 4.6);
        cam.lookAt(0, 0.1, 0);
      } else {
        cam.position.set(5.5, 4.6, 9.6);
        cam.lookAt(0, 0.1, 0);
      }

      const r = new THREE.WebGLRenderer({ antialias: true });
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.setSize(innerWidth, innerHeight);
      document.body.appendChild(r.domElement);

      // review-rig lighting: cool key from front-top, warm fill from the
      // opposite low side, a touch of ambient so flat shades don't go black
      SCENE.add(new THREE.AmbientLight(0x9aa8b8, 0.55));
      const key = new THREE.DirectionalLight(0xcfe4ff, 1.7);
      key.position.set(7, 9, 8);
      SCENE.add(key);
      const fill = new THREE.DirectionalLight(0xffa76a, 0.85);
      fill.position.set(-8, 2.5, -6);
      SCENE.add(fill);
      const back = new THREE.DirectionalLight(0x3f5a6a, 0.5);
      back.position.set(0, -4, -10);
      SCENE.add(back);

      const grid = new THREE.GridHelper(24, 24, 0x33424a, 0x2a363d);
      grid.position.y = 0.05;
      SCENE.add(grid);

      const plinthMat = new THREE.MeshLambertMaterial({ color: 0x3d4a50 });
      const PLINTH = new THREE.CylinderGeometry(0.55, 0.68, 0.3, 20);
      const PLINTH_TOP = 0.32;

      const RAR = { C: 'C', U: 'U', R: 'R', E: 'E' };

      // 4x3 grid, roster order (matches the bestiary). spacing generous enough
      // for the largest readability-scaled fish (a 0.9m minnow renders ~2.9m).
      const COLS = 4;
      const ROWS = 3;
      const GX = 3.5;
      const GY = 3.0;

      const spots = SHALLOWS_SPECIES.filter((s) => !SINGLE || s.id === SINGLE).map((preset, i) => {
        const col = i % COLS;
        const row = Math.floor(i / COLS);
        const x = SINGLE ? 0 : (col - (COLS - 1) / 2) * GX;
        const y = SINGLE ? 0 : ((ROWS - 1) / 2 - row) * GY;

        const plinth = new THREE.Mesh(PLINTH, plinthMat);
        plinth.position.set(x, PLINTH_TOP, 0);
        SCENE.add(plinth);

        const params = generateFishParams(preset, new Rng(42 + i * 7), { zone: 1 });
        const rig = buildFishRig(params);
        const group = new THREE.Group();
        group.add(rig.mesh);
        if (rig.glow) group.add(rig.glow);

        const rs = readabilityScale(params);
        group.scale.setScalar(rs);
        // seat the fish on the plinth: mesh origin is the body centre
        const box = new THREE.Box3().setFromObject(rig.mesh);
        const h = box.max.y - box.min.y;
        group.position.set(x, PLINTH_TOP + h / 2, 0);
        // front-3/4: head (+Z) turned toward the camera side
        group.rotation.y = 0.75;
        SCENE.add(group);

        // a natural slight S-curve, baked once (static reference pose)
        bendStatic(rig, 0.2);

        // canvas-sprite label: [rarity] name / size sub-line
        const label = makeLabel(params);
        label.position.set(x, PLINTH_TOP - 0.28, 0);
        SCENE.add(label);

        return { id: preset.id, params };
      });

      function bendStatic(rig, amp) {
        const n = rig.params.spineSegments;
        const posAttr = rig.geo.attributes.position;
        const pos = posAttr.array;
        const th = new Float32Array(n);
        let ang = 0;
        for (let i = 0; i < n; i++) {
          th[i] = ang;
          ang += amp * Math.sin(i * 0.85);
        }
        const jx = new Float32Array(n + 1);
        const jz = new Float32Array(n + 1);
        for (let i = 1; i <= n; i++) {
          const dz = rig.segZ[i] - rig.segZ[i - 1];
          const a = th[i - 1];
          jx[i] = jx[i - 1] + dz * Math.sin(a);
          jz[i] = jz[i - 1] + dz * Math.cos(a);
        }
        const base = rig.basePos;
        const segOf = rig.segOfVertex;
        for (let v = 0; v < rig.count; v++) {
          const s = segOf[v];
          const bx = base[v * 3], by = base[v * 3 + 1], bz = base[v * 3 + 2];
          const oz = bz - rig.segZ[s];
          const a = th[s];
          const ca = Math.cos(a), sa = Math.sin(a);
          pos[v * 3] = jx[s] + bx * ca + oz * sa;
          pos[v * 3 + 1] = by;
          pos[v * 3 + 2] = jz[s] - bx * sa + oz * ca;
        }
        posAttr.needsUpdate = true;
        rig.geo.computeVertexNormals();
        const norm = rig.geo.attributes.normal;
        if (norm) norm.needsUpdate = true;
      }

      function makeLabel(params) {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 160;
        const g = c.getContext('2d');
        g.font = '700 44px ui-monospace, "Courier New", monospace';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        const rar = RAR[params.rarity] ?? params.rarity;
        const rarW = g.measureText(`[${rar}]`).width + 8;
        // rarity badge
        g.fillStyle = '#e0b45a';
        g.fillText(`[${rar}]`, 150 + rarW / 2, 52);
        // name
        g.fillStyle = '#e9f0ec';
        g.fillText(params.name, 270, 52);
        // sub-line
        g.font = '600 26px ui-monospace, "Courier New", monospace';
        g.fillStyle = '#8aa0a0';
        g.fillText(
          `${params.totalLength.toFixed(1)}m · ${params.weightKg.toFixed(1)}kg · ${params.spineSegments} segs · ${params.finCount} fins`,
          256, 116,
        );
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
        spr.scale.set(3.0, 0.94, 1);
        return spr;
      }

      r.render(SCENE, cam);
    </script>
  </body>
</html>
