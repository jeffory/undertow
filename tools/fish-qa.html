<!doctype html>
<!-- Single-fish QA: /tools/fish-qa.html?species=bell-carp&seed=7
     Renders one generated species large, front-3/4, review lighting. -->
<html>
  <head><meta charset="utf-8"><style>html,body{margin:0;background:#2c2f33}
  #label{position:fixed;left:12px;bottom:10px;color:#cfd8dc;font:14px monospace}</style></head>
  <body>
    <div id="label"></div>
    <script type="module">
      import * as THREE from '/node_modules/three/build/three.module.js';
      import { generateFishParams } from '/src/gen/fishParams.ts';
      import { speciesById } from '/src/data/species.ts';
      import { buildFishRig, FISH_MATERIAL } from '/src/render/fishMesh.ts';
      import { Rng } from '/src/core/rng.ts';

      const q = new URLSearchParams(location.search);
      const id = q.get('species') ?? 'bell-carp';
      const seed = Number(q.get('seed') ?? 7);
      const sp = speciesById(id);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2c2f33);
      const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
      const r = new THREE.WebGLRenderer({ antialias: true });
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.setSize(innerWidth, innerHeight);
      document.body.appendChild(r.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const key = new THREE.DirectionalLight(0xdde6ff, 1.5); key.position.set(2, 3, 4); scene.add(key);
      const fill = new THREE.DirectionalLight(0xffb45e, 0.5); fill.position.set(-3, 1, -2); scene.add(fill);
      scene.add(new THREE.GridHelper(4, 8, 0x555555, 0x3a3d42));

      const params = generateFishParams(sp, new Rng(seed));
      const rig = buildFishRig(params);
      const root = rig.mesh;
      scene.add(root);
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const c = box.getCenter(new THREE.Vector3());
      const dist = Math.max(size.x, size.y, size.z) * 1.6;
      // true side profile: spine runs along Z, so look down +X
      cam.position.set(c.x + dist, c.y, c.z);
      cam.lookAt(c);
      window.__bbox = { x: +size.x.toFixed(3), y: +size.y.toFixed(3), z: +size.z.toFixed(3) };
      document.getElementById('label').textContent =
        `${sp?.name ?? id} · seed ${seed} · segs ${params.spineSegments} · fins ${params.finCount}`;
      let t = 0;
      const spin = q.get('spin') !== '0';
      r.setAnimationLoop(() => { if (spin) root.rotation.y = (t += 0.003); r.render(scene, cam); });
      window.__loaded = true;
    </script>
  </body>
</html>
